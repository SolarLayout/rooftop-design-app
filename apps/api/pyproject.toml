[project]
name = "rooftop-api"
version = "0.1.0"
description = "SolarLayout Rooftop: stateless API (rooftop_api) and engine (rooftop_core)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "import-linter>=2.3,<3",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rooftop_api", "src/rooftop_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.importlinter]
root_packages = ["rooftop_core", "rooftop_api"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "rooftop_core never imports fastapi, starlette, uvicorn or rooftop_api"
type = "forbidden"
source_modules = ["rooftop_core"]
forbidden_modules = ["fastapi", "starlette", "uvicorn", "rooftop_api"]
