<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imagery preview</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0E13;--s1:#12161D;--well:#090C10;--line:#232A36;--line2:#2F3847;--text:#F2F4F7;--dim:#A9B2C0;--accent:#FFB020;--ink:#1A1204}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/20px Geist,system-ui,sans-serif}
#map{position:absolute;inset:0}
.float{background:var(--s1);border:1px solid var(--line);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.45)}
#search{position:absolute;left:16px;top:16px;right:16px;max-width:460px;display:flex;align-items:center;gap:8px;height:52px;padding:0 6px 0 16px}
#search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .16s,filter .16s}
button:hover{filter:brightness(1.14)}button:active{transform:translateY(1px) scale(.985)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{height:40px;padding:0 16px;background:var(--accent);color:var(--ink);border:0;border-radius:10px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 2px rgba(0,0,0,.5),0 8px 22px rgba(255,176,32,.24)}
.quiet{height:44px;padding:0 14px;background:transparent;border:0;border-radius:12px}
#results{position:absolute;left:16px;top:76px;right:16px;max-width:460px;padding:6px;display:none;flex-direction:column}
#results button{height:auto;min-height:44px;padding:8px 12px;text-align:left;background:transparent;border:0;border-radius:10px}
#tools{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;border-radius:18px;white-space:nowrap}
#panel{position:absolute;right:16px;top:16px;width:300px;padding:18px;display:flex;flex-direction:column;gap:12px;border-radius:18px}
#panel h1{margin:0;font:600 22px/26px 'Bricolage Grotesque',Geist,sans-serif;letter-spacing:-.02em}
#panel p{margin:0;color:var(--dim)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{padding:10px 12px;background:var(--well);border:1px solid var(--line);border-radius:10px;box-shadow:inset 0 1px 3px rgba(0,0,0,.65)}
.stat span{display:block;font-size:12px;color:var(--dim)}
.stat b{font:500 15px 'Geist Mono',monospace}
#edges{display:flex;flex-direction:column;font:13px 'Geist Mono',monospace;color:var(--dim);max-height:160px;overflow:auto}
.lbl{padding:3px 8px;background:var(--bg);border-radius:7px;font:500 12px 'Geist Mono',monospace;color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.corner{width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.6);cursor:grab}
@media (max-width:760px){#tools{bottom:72px}#panel{left:16px;right:64px;top:auto;bottom:140px;width:auto;padding:14px}#panel p,#edges{display:none}}
</style>
</head>
<body>
<div id="map" aria-label="Satellite map"></div>

<form id="search" class="float" role="search">
  <input id="q" aria-label="Search an address or paste coordinates" placeholder="Search an address or paste coordinates" autocomplete="off">
  <button class="primary" type="submit">Find</button>
</form>
<div id="results" class="float" role="listbox" aria-label="Search results"></div>

<aside id="panel" class="float" aria-label="Outline">
  <h1>Outline the roof</h1>
  <p>Click each corner of the roof. Drag a corner to adjust it.</p>
  <div class="stats">
    <div class="stat"><span>Area</span><b id="area">0 m²</b></div>
    <div class="stat"><span>Corners</span><b id="count">0</b></div>
    <div class="stat"><span>Perimeter</span><b id="perim">0.0 m</b></div>
    <div class="stat"><span>Zoom</span><b id="zoom">0</b></div>
  </div>
  <div id="edges" aria-live="polite"></div>
</aside>

<div id="tools" class="float" role="toolbar" aria-label="Outline tools">
  <button class="quiet" id="undo">Undo</button>
  <button class="quiet" id="clear">Clear</button>
  <button class="quiet" id="pune">Pune demo site</button>
</div>

<script src="/config.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const KEY = window.ESRI_KEY;
const map = new maplibregl.Map({
  container: 'map',
  center: [73.8553, 18.5201],
  zoom: 17.5,
  maxZoom: 21.5,
  style: {
    version: 8,
    sources: {
      imagery: {
        type: 'raster',
        tiles: ['https://ibasemaps-api.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}?token=' + KEY],
        tileSize: 256,
        maxzoom: 19,
        attribution: 'Powered by Esri · Source: Esri, Vantor, Earthstar Geographics, and the GIS User Community'
      }
    },
    layers: [{ id: 'imagery', type: 'raster', source: 'imagery' }]
  }
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');
map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');
window.__map = map;

// ---- outline -------------------------------------------------------------
let pts = [];            // [lng, lat]
let markers = [];
let labels = [];

const R = 6378137;
function local(p, o) {   // metres east, north of o
  const k = Math.PI / 180;
  return [(p[0] - o[0]) * k * R * Math.cos(o[1] * k), (p[1] - o[1]) * k * R];
}
function measure() {
  if (!pts.length) return { edges: [], area: 0, perim: 0 };
  const o = pts[0], xy = pts.map(p => local(p, o));
  const n = xy.length, edges = [];
  let area = 0, perim = 0;
  for (let i = 0; i < n; i++) {
    const a = xy[i], b = xy[(i + 1) % n];
    if (n > 1 && (i < n - 1 || n > 2)) {
      const d = Math.hypot(b[0] - a[0], b[1] - a[1]);
      edges.push({ i, d, mid: [(pts[i][0] + pts[(i + 1) % n][0]) / 2, (pts[i][1] + pts[(i + 1) % n][1]) / 2] });
      perim += d;
    }
    area += a[0] * b[1] - b[0] * a[1];
  }
  return { edges, area: n > 2 ? Math.abs(area) / 2 : 0, perim };
}
function geojson() {
  const f = [];
  if (pts.length > 2) f.push({ type: 'Feature', geometry: { type: 'Polygon', coordinates: [[...pts, pts[0]]] } });
  if (pts.length === 2) f.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: pts } });
  return { type: 'FeatureCollection', features: f };
}
function redraw() {
  map.getSource('roof')?.setData(geojson());
  markers.forEach(m => m.remove()); labels.forEach(m => m.remove());
  markers = pts.map((p, i) => {
    const el = document.createElement('div'); el.className = 'corner';
    el.addEventListener('click', e => e.stopPropagation());
    const m = new maplibregl.Marker({ element: el, draggable: true }).setLngLat(p).addTo(map);
    m.on('drag', () => { const l = m.getLngLat(); pts[i] = [l.lng, l.lat]; map.getSource('roof')?.setData(geojson()); stats(); });
    m.on('dragend', redraw);
    return m;
  });
  const s = stats();
  labels = s.edges.map(e => {
    const el = document.createElement('div'); el.className = 'lbl'; el.textContent = e.d.toFixed(1) + ' m';
    return new maplibregl.Marker({ element: el }).setLngLat(e.mid).addTo(map);
  });
}
function stats() {
  const s = measure();
  document.getElementById('area').textContent = Math.round(s.area).toLocaleString() + ' m²';
  document.getElementById('count').textContent = pts.length;
  document.getElementById('perim').textContent = s.perim.toFixed(1) + ' m';
  document.getElementById('edges').innerHTML = s.edges.map(e => `<span>Edge ${e.i + 1}: ${e.d.toFixed(1)} m</span>`).join('');
  window.__outline = { points: pts, area: s.area, edges: s.edges.map(e => e.d) };
  return s;
}
map.on('load', () => {
  map.addSource('roof', { type: 'geojson', data: geojson() });
  map.addLayer({ id: 'roof-fill', type: 'fill', source: 'roof', filter: ['==', '$type', 'Polygon'], paint: { 'fill-color': '#FFB020', 'fill-opacity': 0.14 } });
  map.addLayer({ id: 'roof-line', type: 'line', source: 'roof', paint: { 'line-color': '#FFB020', 'line-width': 2.5 } });
  stats();
  window.__ready = true;
});
map.on('click', e => { pts.push([e.lngLat.lng, e.lngLat.lat]); redraw(); });
map.on('zoom', () => { document.getElementById('zoom').textContent = map.getZoom().toFixed(1); });
map.getCanvas().style.cursor = 'crosshair';
document.getElementById('undo').onclick = () => { pts.pop(); redraw(); };
document.getElementById('clear').onclick = () => { pts = []; redraw(); };
document.getElementById('pune').onclick = () => map.flyTo({ center: [73.86, 18.52], zoom: 18, speed: 1.4 });

// ---- search --------------------------------------------------------------
const results = document.getElementById('results');
document.getElementById('search').addEventListener('submit', async e => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const m = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (m) { results.style.display = 'none'; map.flyTo({ center: [+m[2], +m[1]], zoom: 18.5, speed: 1.4 }); return; }
  const c = map.getCenter();
  const url = 'https://geocode-api.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates'
    + '?f=json&maxLocations=5&outFields=Match_addr,Type&location=' + c.lng + ',' + c.lat
    + '&singleLine=' + encodeURIComponent(q) + '&token=' + KEY;
  results.style.display = 'flex';
  results.textContent = 'Searching…';
  try {
    const j = await (await fetch(url)).json();
    results.textContent = '';
    if (j.error || !j.candidates?.length) { results.textContent = j.error ? 'Search is not available: ' + j.error.message : 'Nothing found. Try a fuller address.'; return; }
    j.candidates.forEach(cand => {
      const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'option');
      b.textContent = cand.attributes.Match_addr || cand.address;
      b.onclick = () => { results.style.display = 'none'; map.flyTo({ center: [cand.location.x, cand.location.y], zoom: 18.5, speed: 1.4 }); };
      results.appendChild(b);
    });
  } catch (err) { results.textContent = 'Search failed. Check the network.'; }
});
</script>
</body>
</html>
