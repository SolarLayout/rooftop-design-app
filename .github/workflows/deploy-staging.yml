name: deploy staging

# A green check of a push to main deploys staging (plan/phase-12-plan.md, decision 7): the API's image is built once for
# the commit and pushed to ECR; the web app is built for Vercel's `staging` environment; then the staging function's
# alias `live` is moved to a new version of the image and the web app is deployed; then the smoke runs against
# rooftop.staging.solarlayout.app, and when it passes the image is tagged `staging-smoked-<sha>`, which promote.yml
# requires before production. Whether to deploy at all is tools/deploy/decide.ts: documents alone do not; a commit older
# than staging's does not; a staging that never passed its smoke is deployed again. Started by hand, it always deploys.

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy of staging at a time, queued, never cancelled: a deploy cut in half leaves the two sides apart.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE: https://rooftop.staging.solarlayout.app
  FUNCTION: solarlayout-rooftop-api-staging
  REPOSITORY: solarlayout/rooftop-api
  SMOKED: staging-smoked
  VERCEL_CLI: vercel@59.19.0
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  decide:
    name: whether to deploy
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Staging
    permissions:
      contents: read
      id-token: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - id: commit
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The facts, gathered here; the rule is tools/deploy/decide.ts.
      - id: decide
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          DEPLOYED=$(curl -fsS --max-time 20 "$SITE/api/health" | jq -r '.commit // empty' 2>/dev/null || true)
          DEPLOYED_KNOWN=false; OLDER=false; SMOKED=false; CHANGED=true
          if [ -n "$DEPLOYED" ] && git cat-file -e "$DEPLOYED^{commit}" 2>/dev/null; then
            DEPLOYED_KNOWN=true
            if [ "$DEPLOYED" != "$COMMIT" ] && git merge-base --is-ancestor "$COMMIT" "$DEPLOYED"; then OLDER=true; fi
            CHANGED=$(git diff --name-only "$DEPLOYED" "$COMMIT" | bun tools/code-changed.ts)
            if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$SMOKED-$DEPLOYED" > /dev/null 2> ecr.err; then
              SMOKED=true
            elif ! grep -q ImageNotFoundException ecr.err; then
              cat ecr.err; exit 1
            fi
          fi
          export DEPLOYED DEPLOYED_KNOWN OLDER SMOKED CHANGED
          bun tools/decide-deploy.ts | tee -a "$GITHUB_OUTPUT"
          echo "Staging runs ${DEPLOYED:-nothing it names}. $(bun tools/decide-deploy.ts | tail -1)" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: the API and the web app, on staging
    needs: decide
    if: needs.decide.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: Staging
    permissions:
      contents: read
      id-token: write
    env:
      COMMIT: ${{ needs.decide.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.commit }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The image is for arm64 (Lambda's Graviton); the runner is x86, so the build runs under QEMU.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      # provenance: false, because Lambda refuses a manifest list. Tagged with the commit, which never moves.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ needs.decide.outputs.commit }}
          build-args: ROOFTOP_COMMIT=${{ needs.decide.outputs.commit }}
          cache-from: type=gha,scope=rooftop-api
          cache-to: type=gha,scope=rooftop-api,mode=max

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install JavaScript packages
        run: bun install --frozen-lockfile

      # Built before anything is moved, so that a web app that does not build leaves staging as it was. Vercel's CLI is
      # pinned: the owner's other apps hold 59.19.0 because 59.20.0 broke --prebuilt on bun's install layout. The build
      # reads the environment's variables (ROOFTOP_API_ORIGIN, the Esri key) from Vercel.
      - name: Build the web app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          bun x "$VERCEL_CLI" pull --yes --environment=staging --token="$VERCEL_TOKEN"
          bun x "$VERCEL_CLI" build --target=staging --token="$VERCEL_TOKEN"

      # The image by its digest, never by a tag; a version published for it; the alias the Function URL serves moved
      # to it. The version it moves from is written down: moving the alias back is the API's rollback.
      - name: Point the staging function at the image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}@${{ steps.build.outputs.digest }}
        run: |
          previous=$(aws lambda get-alias --function-name "$FUNCTION" --name live --query FunctionVersion --output text)
          aws lambda update-function-code --function-name "$FUNCTION" --image-uri "$IMAGE" --output text --query LastUpdateStatus
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"
          version=$(aws lambda publish-version --function-name "$FUNCTION" --description "$COMMIT" --query Version --output text)
          aws lambda wait published-version-active --function-name "$FUNCTION" --qualifier "$version"
          aws lambda update-alias --function-name "$FUNCTION" --name live --function-version "$version" --output text --query FunctionVersion
          {
            echo "### The API on staging"
            echo "| | |"; echo "|---|---|"
            echo "| Commit | \`$COMMIT\` |"
            echo "| Image | \`$IMAGE\` |"
            echo "| Function | \`$FUNCTION\`, alias \`live\`: version $previous → **$version** |"
            echo ""
            echo "Roll the API back: \`aws lambda update-alias --function-name $FUNCTION --name live --function-version $previous --region ${{ vars.AWS_REGION }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy the web app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(bun x "$VERCEL_CLI" deploy --prebuilt --target=staging --token="$VERCEL_TOKEN")
          {
            echo "### The web app on staging"
            echo "Deployment \`$url\`, served at $SITE. Roll back: Vercel's dashboard, Deployments, an earlier staging deployment, Promote."
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: the smoke of staging
    needs: [decide, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Staging
    permissions:
      contents: read
      id-token: write
    env:
      COMMIT: ${{ needs.decide.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.commit }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Smoke
        run: |
          status=0
          bun tools/smoke.ts "$SITE" --commit "$COMMIT" > smoke.txt 2>&1 || status=$?
          cat smoke.txt
          { echo "### The smoke"; echo '```'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The mark that this commit passed on staging: the same image under a second tag. promote.yml requires it.
      - name: Mark the image as smoked on staging
        run: |
          manifest=$(aws ecr batch-get-image --repository-name "$REPOSITORY" --image-ids "imageTag=$COMMIT" \
            --query 'images[0].imageManifest' --output text)
          if ! aws ecr put-image --repository-name "$REPOSITORY" --image-tag "$SMOKED-$COMMIT" \
            --image-manifest "$manifest" > /dev/null 2> ecr.err; then
            grep -q ImageAlreadyExistsException ecr.err || { cat ecr.err; exit 1; }
          fi
          echo "Tagged \`$SMOKED-$COMMIT\`: this commit may be promoted to production." >> "$GITHUB_STEP_SUMMARY"
