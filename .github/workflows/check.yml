name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install JavaScript packages
        run: bun install --frozen-lockfile

      - name: Install Python packages
        working-directory: apps/api
        run: uv sync --frozen

      # Browser tests are not part of this workflow: they run locally in `bun check`
      # and, when started by hand, in the e2e workflow.
      - name: bun check, without the browser tests
        run: bun check --skip=e2e
