name: check

# Documents alone run nothing: they go to main directly (decision D26), and no step of the check reads them, but for
# the design tokens, which three web tests hold the code to (app/globals.test.ts, components/ui/design-numbers.test.ts,
# lib/geometry/scene-palette.test.ts). The last pattern that matches a file decides.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!plan/**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/design/design-tokens.md"
  pull_request:
    paths:
      - "**"
      - "!plan/**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/design/design-tokens.md"

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The check without the browser tests takes ten to eleven minutes here when nothing is cached (pytest whole in
    # one process about eight, the web app's types, lint and tests, the proofs); the limit leaves room for a slow
    # runner. A job that hits it is cancelled before the cache is saved, so the next run starts cold again.
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # pytest runs whole and untraced here: the task is cached whole by turbo, and testmon's data is
      # never kept on GitHub (plan/phase-04b-plan.md, decision 4).
      ROOFTOP_CHECK_SELECT: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install JavaScript packages
        run: bun install --frozen-lockfile

      - name: Install Python packages
        working-directory: apps/api
        run: uv sync --frozen

      # The check's cache: turbo's entries, one per task and hash (plan/phase-04b-plan.md, decision 12).
      # Restored from the most recent run of this branch or of main; saved by every run under a key of
      # its own, so that the next run finds it. The lockfiles in the key start a fresh store when the
      # dependencies change. A push to main ignores what it restores (--fresh) and rebuilds it.
      - name: Restore the check's cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: check-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/api/uv.lock') }}-${{ github.run_id }}
          restore-keys: |
            check-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/api/uv.lock') }}-

      # Browser tests are not part of this workflow: they run locally in `bun check`
      # and, when started by hand, in the e2e workflow.
      - name: bun check, without the browser tests
        run: bun check --skip=e2e ${{ github.event_name == 'push' && '--fresh' || '' }}

      - name: Save the check's cache
        if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: check-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/api/uv.lock') }}-${{ github.run_id }}
