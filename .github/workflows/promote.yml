name: promote to production

# Production is the owner's one action (plan/phase-12-plan.md, decisions 7 and 8): started by hand with a commit of main,
# by default the one staging runs now. The commit must have passed staging's smoke (its image tagged
# `staging-smoked-<sha>` by deploy-staging.yml). The API runs that very image, never built again; the web app is built
# from the same commit for Vercel's Production (its rewrite and its key are fixed at build, so a staging build cannot
# serve production), before anything is moved. Then the smoke against rooftop.solarlayout.app.
# Promoting an earlier commit is the rollback of both sides.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit of main to promote (full SHA). Empty, the commit staging runs now.
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE: https://rooftop.solarlayout.app
  STAGING: https://rooftop.staging.solarlayout.app
  FUNCTION: solarlayout-rooftop-api-prod
  REPOSITORY: solarlayout/rooftop-api
  SMOKED: staging-smoked
  VERCEL_CLI: vercel@59.19.0
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  decide:
    name: what to promote
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The commit asked for, or staging's; it must be a whole SHA on main.
      - id: commit
        env:
          ASKED: ${{ inputs.commit }}
        run: |
          sha="$ASKED"
          if [ -z "$sha" ]; then
            sha=$(curl -fsS --max-time 20 "$STAGING/api/health" | jq -r '.commit // empty' 2>/dev/null || true)
            [ -n "$sha" ] || { echo "::error::Staging does not say what it runs; name the commit to promote."; exit 1; }
            echo "Staging runs $sha."
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::\"$sha\" is not a whole commit SHA."; exit 1; fi
          if ! git merge-base --is-ancestor "$sha" origin/main 2>/dev/null; then
            echo "::error::$sha is not a commit of main."; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    name: the API and the web app, on production
    needs: decide
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    permissions:
      contents: read
      id-token: write
    env:
      COMMIT: ${{ needs.decide.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.commit }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The commit's image, by digest, and the mark of its smoke on staging. Only "not found" means not found: any
      # other error of AWS stops the run as it is.
      - id: image
        run: |
          digest_of() {
            if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$1" \
              --query 'imageDetails[0].imageDigest' --output text 2> ecr.err; then return 0; fi
            grep -q ImageNotFoundException ecr.err && return 0
            cat ecr.err >&2; exit 1
          }
          digest=$(digest_of "$COMMIT")
          [ -n "$digest" ] || { echo "::error::No image was built for $COMMIT. Deploy it to staging first."; exit 1; }
          smoked_digest=$(digest_of "${SMOKED}-$COMMIT")
          [ "$smoked_digest" = "$digest" ] || { echo "::error::$COMMIT never passed staging's smoke; it is not promoted."; exit 1; }
          echo "uri=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/$REPOSITORY@$digest" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install JavaScript packages
        run: bun install --frozen-lockfile

      # Built before anything is moved: a web app that does not build leaves production as it was.
      - name: Build the web app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          bun x "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
          bun x "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"

      - name: Point the production function at the image
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          previous=$(aws lambda get-alias --function-name "$FUNCTION" --name live --query FunctionVersion --output text)
          aws lambda update-function-code --function-name "$FUNCTION" --image-uri "$IMAGE" --output text --query LastUpdateStatus
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"
          version=$(aws lambda publish-version --function-name "$FUNCTION" --description "$COMMIT" --query Version --output text)
          aws lambda wait published-version-active --function-name "$FUNCTION" --qualifier "$version"
          aws lambda update-alias --function-name "$FUNCTION" --name live --function-version "$version" --output text --query FunctionVersion
          {
            echo "### The API on production"
            echo "| | |"; echo "|---|---|"
            echo "| Commit | \`$COMMIT\` |"
            echo "| Image | \`$IMAGE\` (built and smoked on staging) |"
            echo "| Function | \`$FUNCTION\`, alias \`live\`: version $previous → **$version** |"
            echo ""
            echo "Roll the API back: \`aws lambda update-alias --function-name $FUNCTION --name live --function-version $previous --region ${{ vars.AWS_REGION }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy the web app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(bun x "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          {
            echo "### The web app on production"
            echo "Deployment \`$url\`, served at $SITE. Roll back: \`vercel rollback\`, or Vercel's dashboard, Instant Rollback."
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: the smoke of production
    needs: [decide, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.commit }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Smoke
        run: |
          status=0
          bun tools/smoke.ts "$SITE" --commit "${{ needs.decide.outputs.commit }}" > smoke.txt 2>&1 || status=$?
          cat smoke.txt
          { echo "### The smoke"; echo '```'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ]; then
            echo "::error::The smoke of production failed. Roll back with the command in the deploy job's summary, or promote the previous commit."
          fi
          exit "$status"
