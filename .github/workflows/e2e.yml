name: e2e

# Browser tests on phone, tablet and desktop. Started by hand only
# (Actions > e2e > Run workflow), so a slow browser install never blocks a pull request.
on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install JavaScript packages
        run: bun install --frozen-lockfile

      - name: Install Python packages
        working-directory: apps/api
        run: uv sync --frozen

      - name: Restore the Playwright browser
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}

      - name: Download the Playwright browser
        if: steps.browser.outputs.cache-hit != 'true'
        working-directory: e2e
        timeout-minutes: 8
        run: bun x playwright install chromium

      - name: Install the libraries the browser needs
        working-directory: e2e
        timeout-minutes: 8
        run: bun x playwright install-deps chromium

      - name: Browser tests
        run: bun check --only=e2e

      - name: Keep the logs and the Playwright report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: |
            .dev/**/*.log
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
